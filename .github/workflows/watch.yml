name: Mercari tracker

# One run keeps checking Mercari for ~5.5 hours, then starts the next run itself,
# so the tracker runs continuously instead of waiting for GitHub's (often hours-late) schedule.
on:
  schedule:
    - cron: "17 * * * *"      # hourly backup: restarts the chain if it ever stops
  workflow_dispatch:          # "Run workflow" button / used by the chain

permissions:
  contents: write             # needed to save seen.json
  actions: write              # needed to start the next run

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Mercari (every ~3 minutes for 5.5 hours)
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: 330
          INTERVAL_SEC: 150

      - name: Start next run
        if: ${{ !cancelled() }}
        run: gh workflow run watch.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
